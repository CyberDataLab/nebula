# ====================================================
# Kafka Access Control Configuration
# Defines users, their credentials, and ACL policies
# ====================================================

users:
  N-DB:
    password: ${KAFKA_DB_PASSWORD}
    topics:
      - name: "nebula-system-control"
        operations: ["all"]
      - name: "experiment-.*"
        operations: ["read"]

  N-RTT:
    password: ${KAFKA_RTT_PASSWORD}
    topics:
      - name: "nebula-system-control"
        operations: ["all"]
      - name: "experiment-.*"
        operations: ["read"]

  N-Controller:
    password: ${KAFKA_CONTROLLER_PASSWORD}
    topics:
      - name: "nebula-system-control"
        operations: ["all"]
      - name: "experiment-.*"
        operations: ["read"]
